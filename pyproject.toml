[project]
name = "citywheels-helpdesk"
version = "0.1.0"
description = "CityWheels CLI help desk with validated specialist agents and deterministic tools"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "pydantic>=2.14.3",
    "pydantic-ai-slim[openai]>=2.71.0",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--basetemp=.pytest_tmp"]
